resolver 127.0.0.11 valid=10s ipv6=off;

upstream projects_backend {
    zone projects_backend 64k;
    server project:8000 resolve;
}

upstream tasks_backend {
    zone tasks_backend 64k;
    server tasks:8000 resolve;
}

limit_req_zone $binary_remote_addr zone=requests_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=logins_per_ip:1m rate=1r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 81m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_req zone=requests_per_ip burst=40 nodelay;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = / { return 302 /projects/; }
    location = /projects { return 308 /projects/; }
    location = /tasks { return 308 /tasks/; }

    location = /projects/api/auth/login {
        client_max_body_size 4k;
        limit_req zone=logins_per_ip burst=5 nodelay;
        proxy_pass http://projects_backend/api/auth/login;
    }

    location = /tasks/api/auth/login {
        client_max_body_size 4k;
        limit_req zone=logins_per_ip burst=5 nodelay;
        proxy_pass http://tasks_backend/api/auth/login;
    }

    location ^~ /projects/ { proxy_pass http://projects_backend/; }
    location ^~ /tasks/ { proxy_pass http://tasks_backend/; }
    location / { return 404; }
}
