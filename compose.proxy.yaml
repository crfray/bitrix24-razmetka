# Optional local rehearsal of the future single-domain routing.
# docker compose -f compose.yaml -f compose.proxy.yaml up -d --build
services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      project:
        condition: service_healthy
      tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - type: bind
        source: ./deploy/nginx-local.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
